<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>✍️ Порядок черт</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5/dist/hanzi-writer.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--tg-theme-bg-color, #1a1a2e);
      color: var(--tg-theme-text-color, #ffffff);
      min-height: 100vh;
      padding: 20px 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      user-select: none;
      -webkit-user-select: none;
    }
    
    .header {
      text-align: center;
      margin-bottom: 20px;
      width: 100%;
    }
    
    .hanzi-big {
      font-size: 48px;
      font-weight: bold;
      margin-bottom: 5px;
    }
    
    .pinyin {
      font-size: 22px;
      color: var(--tg-theme-hint-color, #aaaaaa);
      margin-bottom: 5px;
    }
    
    .translation {
      font-size: 18px;
      color: var(--tg-theme-hint-color, #aaaaaa);
    }
    
    .canvas-container {
      background: var(--tg-theme-secondary-bg-color, #16213e);
      border-radius: 16px;
      padding: 15px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
      margin-bottom: 20px;
    }
    
    #target {
      background: white;
      border-radius: 12px;
    }
    
    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin-bottom: 15px;
      width: 100%;
      max-width: 400px;
    }
    
    button {
      flex: 1;
      min-width: 120px;
      padding: 14px 20px;
      font-size: 16px;
      font-weight: 500;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s;
      color: white;
    }
    
    button:active {
      transform: scale(0.97);
    }
    
    .btn-animate { background: #2ecc71; }
    .btn-animate:hover { background: #27ae60; }
    
    .btn-quiz { background: #e94560; }
    .btn-quiz:hover { background: #c73e54; }
    
    .status {
      text-align: center;
      font-size: 18px;
      min-height: 30px;
      margin-bottom: 10px;
      font-weight: 500;
    }
    
    .correct { color: #2ecc71; }
    .wrong { color: #e94560; }
    .info { color: var(--tg-theme-hint-color, #aaaaaa); }
    
    .hint {
      text-align: center;
      font-size: 14px;
      color: var(--tg-theme-hint-color, #aaaaaa);
      margin-top: 10px;
      padding: 0 10px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="hanzi-big" id="hanzi">字</div>
    <div class="pinyin" id="pinyin">zì</div>
    <div class="translation" id="translation">иероглиф</div>
  </div>
  
  <div class="canvas-container">
    <div id="target"></div>
  </div>
  
  <div class="status" id="status">Нажмите кнопку для начала</div>
  
  <div class="buttons">
    <button class="btn-animate" onclick="animateStroke()">▶ Показать</button>
    <button class="btn-quiz" onclick="startQuiz()">🎯 Тренировка</button>
  </div>
  
  <div class="hint">
    💡 В режиме тренировки рисуйте черты пальцем или мышкой в правильном порядке
  </div>

  <script>
    // Инициализация Telegram Web App
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();
    
    // Получаем параметры из URL
    const params = new URLSearchParams(window.location.search);
    const char = params.get('char') || '字';
    const pinyin = params.get('pinyin') || 'zì';
    const translation = params.get('translation') || 'иероглиф';
    
    // Отображаем информацию о слове
    document.getElementById('hanzi').textContent = char;
    document.getElementById('pinyin').textContent = pinyin;
    document.getElementById('translation').textContent = translation;
    
    // Создаем Hanzi Writer
    const writer = HanziWriter.create('target', char, {
      width: 280,
      height: 280,
      padding: 20,
      showOutline: true,
      showCharacter: false,
      strokeColor: '#333',
      outlineColor: '#ddd',
      drawingColor: '#e94560',
      drawingWidth: 4,
      showHintAfterMisses: 2,
      highlightOnComplete: true,
      highlightColor: '#2ecc71',
      delayBetweenStrokes: 300,
      strokeAnimationSpeed: 1,
    });
    
    let quizActive = false;
    
    function animateStroke() {
      quizActive = false;
      document.getElementById('status').innerHTML = 'Показываю порядок черт...';
      document.getElementById('status').className = 'status info';
      
      writer.animateCharacter({
        onComplete: function() {
          document.getElementById('status').innerHTML = '✅ Готово! Нажмите "Тренировка" для практики';
        }
      });
    }
    
    function startQuiz() {
      quizActive = true;
      
      writer.quiz({
        onCorrectStroke: function(data) {
          document.getElementById('status').innerHTML = 
            `<span class="correct">✅</span>`;
        },
        onMistake: function(data) {
          document.getElementById('status').innerHTML = 
            `<span class="wrong">Попробуйте ещё раз</span>`;
        },
        onComplete: function(data) {
          quizActive = false;
          document.getElementById('status').innerHTML = 
            `<span class="correct">🎉 Готово!</span>`;
          
          if (tg.sendData) {
            tg.sendData(JSON.stringify({
              type: 'stroke_quiz_complete',
              char: char,
              mistakes: data.totalMistakes,
              totalStrokes: data.totalStrokes
            }));
          }
        }
      });
      
      document.getElementById('status').innerHTML = 'Нарисуйте первую черту...';
      document.getElementById('status').className = 'status info';
    }
  </script>
</body>
</html>
